name: smackend-phase0
services:
  postgres:
    image: postgres:17
    command: ["postgres", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phase0_notes}
      POSTGRES_USER: ${POSTGRES_USER:-phase0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
